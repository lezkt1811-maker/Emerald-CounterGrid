<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#14081f"/>
      <stop offset="1" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff007f" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#8b00ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8b00ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- backdrop: rounded square so the icon also reads on platforms that crop it -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- plasma halo -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#8b00ff" stroke-width="46" opacity="0.35" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00f0ff" stroke-width="10" opacity="0.5" filter="url(#glow)"/>

  <!-- outer dashed ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#8b00ff" stroke-width="5" stroke-dasharray="14 12" filter="url(#glow)"/>

  <!-- 13 node ring; Ophiuchus (index 8) is pink and larger -->
  <g filter="url(#glow)">
    <!-- node positions: angle = -90 + i*360/13 -->
    <circle cx="256.0" cy="84.0" r="9" fill="#050508" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="332.2" cy="97.8" r="9" fill="#050508" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="390.4" cy="145.3" r="9" fill="#050508" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="418.8" cy="214.4" r="9" fill="#050508" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="418.8" cy="297.6" r="9" fill="#050508" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="390.4" cy="366.7" r="9" fill="#050508" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="332.2" cy="414.2" r="9" fill="#050508" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="256.0" cy="428.0" r="9" fill="#050508" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="179.8" cy="414.2" r="16" fill="#050508" stroke="#ff007f" stroke-width="6"/>
    <circle cx="121.6" cy="366.7" r="9" fill="#050508" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="93.2" cy="297.6" r="9" fill="#050508" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="93.2" cy="214.4" r="9" fill="#050508" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="121.6" cy="145.3" r="9" fill="#050508" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="179.8" cy="97.8" r="9" fill="#050508" stroke="#00f0ff" stroke-width="4"/>
  </g>

  <!-- inner counter ring -->
  <circle cx="256" cy="256" r="122" fill="url(#core)"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#ff007f" stroke-width="6" stroke-dasharray="120 40" opacity="0.8" filter="url(#glow)"/>

  <!-- gateway: dark core with pink rim -->
  <circle cx="256" cy="256" r="84" fill="#050508"/>
  <circle cx="256" cy="256" r="84" fill="none" stroke="#ff007f" stroke-width="5" filter="url(#glow)"/>

  <!-- Ophiuchus serpent: two intertwined strands around a staff -->
  <line x1="256" y1="186" x2="256" y2="326" stroke="#c8f0ff" stroke-opacity="0.45" stroke-width="3"/>
  <path d="M256 186 C 296 206, 216 226, 256 256 S 216 306, 256 326" fill="none" stroke="#00f0ff" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M256 186 C 216 206, 296 226, 256 256 S 296 306, 256 326" fill="none" stroke="#ff007f" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="256" cy="186" r="9" fill="#00f0ff" filter="url(#glow)"/>
</svg>
